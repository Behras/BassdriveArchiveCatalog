name: Sync archive catalog

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test catalog scanner
        run: python -m unittest tools/test_sync_archive_catalog.py

      - name: Refresh archive data
        run: python tools/sync_archive_catalog.py --catalog-dir data

      - name: Publish changed catalog files
        shell: bash
        run: |
          if git diff --quiet -- data; then
            echo "Catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Update Bassdrive archive catalog"
          git push
